server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

external:
  fakestore:
    base-url: https://fakestoreapi.com
    timeout:
      connect: 3000
      read: 5000

logging:
  level:
    com.elitec.ecommerce: INFO
    org.springframework.web.client.RestTemplate: WARN
    root: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info